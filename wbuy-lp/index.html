<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte seu kit (dev)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      /* o tema da Wbuy expõe a altura do cabeçalho; a <style> colada na página de conteúdo
         (wbuy-lp/wbuy/pagina-conteudo.html) usa isso em --onb-topo. Igual aqui, para o teste ver. */
      :root {
        --topo_altura: 90px;
        --topo_altura_mobile: 60px;
      }
      #onb-kit-lp {
        --onb-topo: var(--topo_altura, 0px);
        min-height: 80vh;
      }
      @media (max-width: 800px) {
        #onb-kit-lp {
          --onb-topo: var(--topo_altura_mobile, 0px);
        }
      }
      .fake-topo,
      .fake-rodape {
        background: #111;
        color: #aaa;
        font: 13px system-ui;
        padding: 18px;
        text-align: center;
      }
      /* igual à página de conteúdo da Wbuy depois do CSS da LP: largura toda */
      .container {
        width: 100%;
      }
      /* chat flutuante da loja: mesmos ids e medidas do tema, para o teste ver o que cobre o Comprar */
      #lb-widget-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
      }
      #lb-toggle-btn {
        width: 60px;
        height: 60px;
        background: #25d366;
        border-radius: 50%;
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.15);
        cursor: pointer;
      }
      #lb-chat-window {
        display: none;
        position: absolute;
        right: 0;
        bottom: 80px;
        width: 360px;
        height: 550px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgb(0 0 0 / 0.2);
      }
      #lb-chat-window.open {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="fake-topo">Topo da loja Wbuy (simulado)</div>
    <div class="container">
      <!-- igual ao que vai colado na página de conteúdo da Wbuy -->
      <div id="onb-kit-lp"></div>
    </div>
    <div class="fake-rodape">Rodapé da loja (simulado)</div>
    <div id="lb-widget-container">
      <div id="lb-chat-window"></div>
      <div id="lb-toggle-btn" title="Chat da loja (simulado)"></div>
    </div>
    <script>
      // o tema expõe lbToggleChat(); a LP usa em "Falar no WhatsApp"
      window.lbToggleChat = () =>
        document.getElementById("lb-chat-window").classList.toggle("open");
      document.getElementById("lb-toggle-btn").addEventListener("click", window.lbToggleChat);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
