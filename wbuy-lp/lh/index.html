<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte seu kit (build, para o Lighthouse)</title>
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      /* o tema da Wbuy expõe a altura do cabeçalho; a <style> colada na página de conteúdo
         (wbuy-lp/wbuy/pagina-conteudo.html) usa isso em --onb-topo. Igual aqui, para o teste ver. */
      :root {
        --topo_altura: 90px;
        --topo_altura_mobile: 60px;
      }
      #onb-kit-lp {
        --onb-topo: var(--topo_altura, 0px);
        min-height: 80vh;
      }
      @media (max-width: 800px) {
        #onb-kit-lp {
          --onb-topo: var(--topo_altura_mobile, 0px);
        }
      }
      .fake-topo,
      .fake-rodape {
        background: #111;
        color: #aaa;
        font: 13px system-ui;
        padding: 18px;
        text-align: center;
      }
      /* casca do tema da Wbuy: #geral tem overflow hidden, que anularia o sticky do palco */
      #geral {
        overflow: hidden;
      }
      /* chat flutuante da loja: mesmos ids e medidas do tema */
      #lb-widget-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
      }
      #lb-toggle-btn {
        width: 60px;
        height: 60px;
        background: #25d366;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="fake-topo">Topo da loja Wbuy (simulado)</div>
    <!-- a mesma casca da página de conteúdo da Wbuy: #geral > .container-fluid > #informacoes -->
    <div id="geral">
      <div class="container-fluid">
        <div id="informacoes">
          <div class="central">
            <article class="texto">
              <div id="onb-kit-lp"></div>
            </article>
          </div>
        </div>
      </div>
    </div>
    <div class="fake-rodape">Rodapé da loja (simulado)</div>
    <div id="lb-widget-container">
      <div id="lb-chat-window"></div>
      <div id="lb-toggle-btn"></div>
    </div>
    <!-- o mesmo bundle que vai para premium.olhonabrasa.com.br/wbuy-lp/ -->
    <script type="module" src="/wbuy-lp/kit-builder.js"></script>
  </body>
</html>
